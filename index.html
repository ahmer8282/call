<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Multi-User Walkie-Talkie</title>
    <!-- Jitsi Meet External API -->
    <script src='https://meet.jit.si/external_api.js'></script>
    <!-- PeerJS Fallback -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.9);
            --primary: #007aff;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9500;
            --text: #ffffff;
            --text-secondary: #8e8e93;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* Video Containers */
        #jitsi-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        #p2p-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
            display: none; /* Hidden by default */
            flex-direction: column;
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        #remoteVideo { z-index: 1; }

        #localVideo {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 80px;
            height: 110px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 2;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Custom UI Overlay */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .room-code-display {
            background: rgba(0, 122, 255, 0.15);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .room-code-display label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .room-code-display .code {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            font-family: monospace;
            letter-spacing: 4px;
        }

        .share-buttons {
            display: flex;
            gap: 8px;
        }

        .share-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .share-btn.copy { background: var(--primary); }
        .share-btn.qr { background: var(--warning); }

        .qr-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }

        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: var(--primary); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }

        .status {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            min-height: 18px;
        }

        .hidden { display: none !important; }

        .walkie-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .room-display {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-display strong {
            color: var(--primary);
            font-size: 18px;
        }

        .mode-badge {
            background: var(--warning);
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .ptt-button {
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.15s;
        }

        .ptt-button.muted {
            background: var(--danger);
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
        }

        .ptt-button.unmuted {
            background: var(--success);
            box-shadow: 0 0 20px rgba(52, 199, 89, 0.4);
        }

        .ptt-button:active { transform: scale(0.95); }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .action-row button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }

        @media (orientation: landscape) and (max-height: 500px) {
            .controls { padding: 10px; gap: 8px; }
            .ptt-button { padding: 12px; font-size: 16px; }
            .room-code-display .code { font-size: 24px; }
            #localVideo { width: 60px; height: 80px; }
        }
    </style>
</head>
<body>

    <!-- Jitsi Video Grid (Primary) -->
    <div id="jitsi-container"></div>

    <!-- P2P Video Fallback -->
    <div id="p2p-container">
        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- SETUP SCREEN -->
    <div class="controls" id="setupScreen">
        <div class="status">Your Room Code:</div>
        
        <div class="room-code-display">
            <label>Share this link or QR code:</label>
            <div class="code" id="roomCode">----</div>
        </div>

        <div class="share-buttons">
            <button class="share-btn copy" id="copyLinkBtn">📋 Copy Link</button>
            <button class="share-btn qr" id="showQrBtn">📱 Show QR</button>
        </div>

        <div class="qr-container hidden" id="qrContainer">
            <div id="qrcode"></div>
        </div>

        <button class="btn-success" id="joinBtn">📹 Join Room</button>
    </div>

    <!-- CALL SCREEN -->
    <div class="controls hidden" id="callScreen">
        <div class="walkie-controls">
            <div class="room-display">
                <span>Room: <strong id="currentRoom">-</strong></span>
                <span class="mode-badge" id="modeBadge">Server Mode</span>
            </div>
            
            <div class="status" id="statusCall">Connecting to server...</div>

            <button class="ptt-button muted" id="pttBtn">
                <span id="pttIcon">🔇</span>
                <span id="pttText">TAP TO TALK</span>
            </button>

            <div class="action-row">
                <button class="btn-success" id="camBtn">📹 Camera ON</button>
                <button class="btn-danger" id="hangupBtn">📞 Leave</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const roomCodeDisplay = document.getElementById('roomCode');
        const joinBtn = document.getElementById('joinBtn');
        const setupScreen = document.getElementById('setupScreen');
        const callScreen = document.getElementById('callScreen');
        const currentRoomDisplay = document.getElementById('currentRoom');
        const statusCall = document.getElementById('statusCall');
        const pttBtn = document.getElementById('pttBtn');
        const pttIcon = document.getElementById('pttIcon');
        const pttText = document.getElementById('pttText');
        const camBtn = document.getElementById('camBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const showQrBtn = document.getElementById('showQrBtn');
        const qrContainer = document.getElementById('qrContainer');
        const toast = document.getElementById('toast');
        const modeBadge = document.getElementById('modeBadge');

        let myRoom;
        let qrCode = null;
        let jitsiApi = null;
        let connectionMode = 'jitsi'; // 'jitsi' or 'p2p'
        
        // P2P Variables
        let peer, localStream, currentCall, myUserId, otherUserId, registrationAttempt = 1;

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function getRoomFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('room')?.toUpperCase();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function initRoom() {
            myRoom = getRoomFromUrl() || generateRoomCode();
            roomCodeDisplay.textContent = myRoom;
            if (!getRoomFromUrl()) {
                const newUrl = `${window.location.origin}${window.location.pathname}?room=${myRoom}`;
                window.history.replaceState({}, '', newUrl);
            }
        }

        copyLinkBtn.addEventListener('click', async () => {
            const shareUrl = `${window.location.origin}${window.location.pathname}?room=${myRoom}`;
            try {
                await navigator.clipboard.writeText(shareUrl);
                showToast('✅ Link copied!');
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = shareUrl;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast('✅ Link copied!');
            }
        });

        showQrBtn.addEventListener('click', () => {
            if (qrContainer.classList.contains('hidden')) {
                const shareUrl = `${window.location.origin}${window.location.pathname}?room=${myRoom}`;
                if (!qrCode) {
                    qrCode = new QRCode(document.getElementById('qrcode'), {
                        text: shareUrl, width: 180, height: 180,
                        colorDark: '#000000', colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
                qrContainer.classList.remove('hidden');
                showQrBtn.textContent = '📱 Hide QR';
            } else {
                qrContainer.classList.add('hidden');
                showQrBtn.textContent = '📱 Show QR';
            }
        });

        joinBtn.addEventListener('click', async () => {
            joinBtn.disabled = true;
            joinBtn.textContent = '⏳ Connecting...';
            setupScreen.classList.add('hidden');
            callScreen.classList.remove('hidden');
            currentRoomDisplay.textContent = myRoom;

            // Check if Jitsi script was blocked by ad-blocker
            if (typeof JitsiMeetExternalAPI === 'undefined') {
                console.log('Jitsi blocked, falling back to P2P');
                fallbackToP2P();
                return;
            }

            // Try Jitsi First
            try {
                const domain = 'meet.jit.si';
                const options = {
                    roomName: `WalkieTalkie_${myRoom}`,
                    width: '100%',
                    height: '100%',
                    parentNode: document.querySelector('#jitsi-container'),
                    configOverwrite: {
                        startWithAudioMuted: true,
                        startWithVideoMuted: false,
                        prejoinPageEnabled: false,
                        disableDeepLinking: true,
                        resolution: 480,
                        constraints: { video: { height: { ideal: 480 } } }
                    },
                    interfaceConfigOverwrite: {
                        TOOLBAR_BUTTONS: [],
                        SHOW_JITSI_WATERMARK: false,
                        SHOW_WATERMARK_FOR_GUESTS: false,
                        DEFAULT_BACKGROUND: '#121212',
                        MOBILE_APP_PROMO: false,
                        TILE_VIEW_MAX_COLUMNS: 3,
                        HIDE_INVITE_MORE_HEADER: true
                    },
                    userInfo: { displayName: 'User' + Math.floor(Math.random()*1000) }
                };

                jitsiApi = new JitsiMeetExternalAPI(domain, options);
                connectionMode = 'jitsi';

                // Timeout fallback: If Jitsi takes longer than 6 seconds, switch to P2P
                let jitsiJoined = false;
                setTimeout(() => {
                    if (!jitsiJoined && connectionMode === 'jitsi') {
                        console.log('Jitsi timeout, falling back to P2P');
                        statusCall.textContent = 'Server busy, switching to direct connection...';
                        if (jitsiApi) {
                            jitsiApi.dispose();
                            jitsiApi = null;
                        }
                        fallbackToP2P();
                    }
                }, 6000);

                jitsiApi.on('videoConferenceJoined', () => {
                    jitsiJoined = true;
                    statusCall.textContent = 'Connected! Tap to talk.';
                    modeBadge.textContent = 'Server Mode (Up to 50 users)';
                    modeBadge.style.background = 'var(--success)';
                    modeBadge.style.color = '#fff';
                    updatePTTButton(true); // Start muted
                    updateCamButton(false); // Start unmuted
                });

                jitsiApi.on('audioMuteStatusChanged', (payload) => updatePTTButton(payload.muted));
                jitsiApi.on('videoMuteStatusChanged', (payload) => updateCamButton(payload.muted));
                jitsiApi.on('readyToClose', () => location.reload());

            } catch (err) {
                console.error('Jitsi init error:', err);
                fallbackToP2P();
            }
        });

        // --- P2P FALLBACK SYSTEM ---
        async function fallbackToP2P() {
            connectionMode = 'p2p';
            document.getElementById('jitsi-container').style.display = 'none';
            document.getElementById('p2p-container').style.display = 'flex';
            modeBadge.textContent = 'Direct Mode (Best for 2-4 users)';
            modeBadge.style.background = 'var(--warning)';
            modeBadge.style.color = '#000';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                await localVideo.play();
                
                localStream.getAudioTracks()[0].enabled = false; // Start muted
                updatePTTButton(true);
                updateCamButton(false);

                initPeer();
            } catch (err) {
                statusCall.textContent = 'Camera/Mic access denied.';
                joinBtn.disabled = false;
                joinBtn.textContent = '📹 Retry';
            }
        }

        function initPeer() {
            myUserId = `${myRoom}-user${registrationAttempt}`;
            otherUserId = `${myRoom}-user${registrationAttempt === 1 ? 2 : 1}`;
            
            peer = new Peer(myUserId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', id => {
                statusCall.textContent = 'Connected (Direct). Waiting for others...';
                if (registrationAttempt === 2) {
                    setTimeout(() => {
                        if (!currentCall) {
                            const call = peer.call(otherUserId, localStream);
                            handleCall(call);
                        }
                    }, 1000);
                }
            });

            peer.on('call', call => {
                statusCall.textContent = 'Connected (Direct)!';
                call.answer(localStream);
                handleCall(call);
            });

            peer.on('error', err => {
                if (err.type === 'unavailable-id' && registrationAttempt === 1) {
                    registrationAttempt = 2;
                    peer.destroy();
                    setTimeout(() => initPeer(), 500);
                } else if (err.type === 'peer-unavailable') {
                    statusCall.textContent = 'Waiting for other person to join...';
                }
            });
        }

        function handleCall(call) {
            currentCall = call;
            call.on('stream', remoteStream => {
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = remoteStream;
                remoteVideo.play().catch(e => console.error(e));
            });
            call.on('close', () => {
                currentCall = null;
                document.getElementById('remoteVideo').srcObject = null;
                statusCall.textContent = 'Disconnected. Waiting to reconnect...';
            });
        }

        // --- UI CONTROLS ---
        function updatePTTButton(isMuted) {
            if (isMuted) {
                pttBtn.classList.remove('unmuted');
                pttBtn.classList.add('muted');
                pttIcon.textContent = '🔇';
                pttText.textContent = 'TAP TO TALK';
            } else {
                pttBtn.classList.remove('muted');
                pttBtn.classList.add('unmuted');
                pttIcon.textContent = '🎤';
                pttText.textContent = 'TAP TO MUTE';
            }
        }

        function updateCamButton(isMuted) {
            if (isMuted) {
                camBtn.textContent = '📺 Camera OFF';
                camBtn.className = 'btn-danger';
            } else {
                camBtn.textContent = '📹 Camera ON';
                camBtn.className = 'btn-success';
            }
        }

        pttBtn.addEventListener('click', () => {
            if (connectionMode === 'jitsi' && jitsiApi) {
                jitsiApi.executeCommand('toggleAudio');
            } else if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                updatePTTButton(!audioTrack.enabled);
            }
        });

        camBtn.addEventListener('click', () => {
            if (connectionMode === 'jitsi' && jitsiApi) {
                jitsiApi.executeCommand('toggleVideo');
            } else if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                videoTrack.enabled = !videoTrack.enabled;
                updateCamButton(!videoTrack.enabled);
            }
        });

        hangupBtn.addEventListener('click', () => {
            if (connectionMode === 'jitsi' && jitsiApi) {
                jitsiApi.executeCommand('hangup');
            } else {
                if (currentCall) currentCall.close();
                if (peer) peer.destroy();
                if (localStream) localStream.getTracks().forEach(track => track.stop());
                location.reload();
            }
        });

        initRoom();
    </script>
</body>
</html>
