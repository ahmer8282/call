<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📡 Walkie-Talkie · Voice & Video</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #1a1e2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            touch-action: manipulation;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #232837;
            border-radius: 48px 48px 32px 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #3d445b;
            transition: all 0.2s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #c8d0e6;
            padding-bottom: 12px;
            border-bottom: 1px solid #2f3649;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 i {
            color: #f5b042;
            font-size: 1.6rem;
        }
        .status-badge {
            background: #2e354a;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #aab3d0;
            border: 1px solid #3d455e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge i {
            color: #4caf84;
            font-size: 0.6rem;
        }

        /* video area */
        .video-grid {
            margin: 18px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .video-box {
            background: #11141f;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            border: 2px solid #2f3649;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0b0d14;
            display: block;
        }
        .video-box .local-label, .video-box .remote-label {
            position: absolute;
            bottom: 12px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #e0e6ff;
            border: 1px solid #4b536e;
            pointer-events: none;
        }
        .video-box .remote-label {
            left: auto;
            right: 16px;
            background: rgba(40, 50, 80, 0.7);
        }
        .video-box .placeholder-icon {
            color: #3d455e;
            font-size: 3.4rem;
            opacity: 0.5;
        }

        .walkie-controls {
            background: #1e2335;
            border-radius: 60px;
            padding: 16px 20px;
            margin: 8px 0 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 20px;
            border: 1px solid #31384d;
        }
        .btn {
            background: #2f3649;
            border: none;
            border-radius: 60px;
            padding: 12px 20px;
            color: #d3daf5;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #414a63;
            box-shadow: 0 6px 0 #141824;
            touch-action: manipulation;
            flex: 1 1 auto;
            min-width: 100px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #141824;
        }
        .btn-primary {
            background: #3f4b6b;
            border-color: #5b6890;
            color: white;
            box-shadow: 0 6px 0 #1f263a;
        }
        .btn-success {
            background: #2d7a5a;
            border-color: #3fa07a;
            color: white;
            box-shadow: 0 6px 0 #154d37;
        }
        .btn-danger {
            background: #9e3d4a;
            border-color: #c95666;
            color: white;
            box-shadow: 0 6px 0 #632b33;
        }
        .btn-warning {
            background: #b8863a;
            border-color: #dfa84a;
            color: #1a1e2c;
            box-shadow: 0 6px 0 #7a5a24;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #141824;
            pointer-events: none;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid #3f4865;
            border-radius: 60px;
            padding: 10px 14px;
            color: #bcc4e0;
            font-size: 1.1rem;
            box-shadow: none;
            min-width: 54px;
            flex: 0 1 auto;
        }
        .icon-btn:active {
            transform: scale(0.94);
        }

        .call-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }
        .call-actions .btn {
            flex: 1 1 100px;
        }

        .info-note {
            margin-top: 20px;
            padding: 12px 16px;
            background: #191e2d;
            border-radius: 60px;
            color: #9aa5c7;
            font-size: 0.7rem;
            text-align: center;
            border: 1px solid #2d3447;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .info-note i {
            color: #f0b34b;
        }

        .footer {
            margin-top: 14px;
            color: #5c6583;
            font-size: 0.6rem;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* responsive */
        @media (max-width: 420px) {
            .container { padding: 16px 12px 24px; }
            .btn { font-size: 0.8rem; padding: 10px 12px; min-width: 80px; }
            .walkie-controls { gap: 10px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1><i class="fas fa-bolt"></i> WalkieTalk</h1>
        <div class="status-badge"><i class="fas fa-circle"></i> <span id="statusText">Ready</span></div>
    </div>

    <!-- Video grid -->
    <div class="video-grid">
        <div class="video-box" id="remoteVideoBox">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <span class="remote-label"><i class="fas fa-user"></i> Remote</span>
            <div class="placeholder-icon" id="remotePlaceholder"><i class="fas fa-video-slash"></i></div>
        </div>
        <div class="video-box" id="localVideoBox">
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="local-label"><i class="fas fa-user"></i> You</span>
            <div class="placeholder-icon" id="localPlaceholder"><i class="fas fa-camera"></i></div>
        </div>
    </div>

    <!-- Walkie controls -->
    <div class="walkie-controls">
        <button class="btn btn-success" id="callBtn"><i class="fas fa-phone-alt"></i> Call</button>
        <button class="btn btn-danger" id="hangupBtn" disabled><i class="fas fa-phone-slash"></i> Hangup</button>
        <button class="btn btn-warning" id="toggleVideoBtn"><i class="fas fa-video"></i> Video</button>
        <button class="btn icon-btn" id="toggleAudioBtn"><i class="fas fa-microphone"></i></button>
    </div>

    <!-- extra actions -->
    <div class="call-actions">
        <button class="btn btn-primary" id="startLocalBtn"><i class="fas fa-play"></i> Start local</button>
    </div>

    <div class="info-note">
        <i class="fas fa-wifi"></i> <span id="connectionInfo">WebRTC · UAE ready</span>
        <i class="fas fa-rotate-right" id="resetIcon" style="cursor:pointer; margin-left: 4px;"></i>
    </div>
    <div class="footer">
        <i class="fas fa-shield-alt"></i> P2P · works on mobile · hosted on GitHub
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM elements
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const localPlaceholder = document.getElementById('localPlaceholder');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusText = document.getElementById('statusText');
        const connectionInfo = document.getElementById('connectionInfo');

        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const startLocalBtn = document.getElementById('startLocalBtn');
        const resetIcon = document.getElementById('resetIcon');

        // state
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let isCallActive = false;
        let isVideoEnabled = true;
        let isAudioEnabled = true;

        // STUN / TURN (UAE friendly: using Google STUN and a backup TURN)
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceCandidatePoolSize: 10
        };

        // ----- helper functions -----
        function updateStatus(text, isGood = true) {
            statusText.innerText = text;
        }

        function updateConnectionInfo(text) {
            connectionInfo.innerText = text;
        }

        function setButtons(callActive) {
            callBtn.disabled = callActive;
            hangupBtn.disabled = !callActive;
            if (callActive) {
                callBtn.classList.remove('btn-success');
                callBtn.classList.add('btn-secondary');
            } else {
                callBtn.classList.remove('btn-secondary');
                callBtn.classList.add('btn-success');
            }
        }

        // reset UI to idle
        function resetUI() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if (remoteStream) {
                remoteStream.getTracks().forEach(t => t.stop());
                remoteStream = null;
            }
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            localPlaceholder.style.display = 'flex';
            remotePlaceholder.style.display = 'flex';
            isCallActive = false;
            isVideoEnabled = true;
            isAudioEnabled = true;
            setButtons(false);
            updateStatus('Ready');
            updateConnectionInfo('WebRTC · idle');
            toggleVideoBtn.innerHTML = '<i class="fas fa-video"></i> Video';
            toggleAudioBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        }

        // ----- get local stream (with audio + video) -----
        async function getLocalStream(videoEnabled = true, audioEnabled = true) {
            try {
                const constraints = {
                    audio: audioEnabled,
                    video: videoEnabled ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                return stream;
            } catch (err) {
                console.error('getUserMedia error:', err);
                // fallback: try audio only
                if (videoEnabled) {
                    try {
                        const audioOnly = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                        return audioOnly;
                    } catch (e2) {
                        throw new Error('Could not access camera/mic: ' + e2.message);
                    }
                }
                throw err;
            }
        }

        // ----- display local stream -----
        async function startLocalStream() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                localStream = await getLocalStream(isVideoEnabled, isAudioEnabled);
                localVideo.srcObject = localStream;
                localPlaceholder.style.display = 'none';
                // if video track missing, show placeholder
                const hasVideo = localStream.getVideoTracks().length > 0;
                if (!hasVideo) {
                    localPlaceholder.style.display = 'flex';
                    localPlaceholder.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                } else {
                    localPlaceholder.style.display = 'none';
                }
                updateStatus('Local ready');
                return localStream;
            } catch (err) {
                alert('Could not access camera/microphone. Please allow permissions.\n' + err.message);
                updateStatus('Error');
                return null;
            }
        }

        // ----- create peer connection with negotiation -----
        async function createPeerConnection(stream) {
            if (!stream) throw new Error('No local stream');
            const pc = new RTCPeerConnection(rtcConfig);
            // add local tracks
            stream.getTracks().forEach(track => {
                pc.addTrack(track, stream);
            });

            // handle remote tracks
            pc.ontrack = (event) => {
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    remoteVideo.srcObject = remoteStream;
                }
                remoteStream.addTrack(event.track);
                remotePlaceholder.style.display = 'none';
                updateStatus('Connected');
                updateConnectionInfo('🔗 Peer connected');
            };

            // ICE candidate logging
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    console.log('ICE candidate:', e.candidate);
                }
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                console.log('Connection state:', state);
                if (state === 'connected') {
                    updateStatus('Connected');
                    updateConnectionInfo('✅ Active call');
                } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                    if (isCallActive) {
                        updateStatus('Disconnected');
                        updateConnectionInfo('⚠️ Call ended');
                        hangUp();
                    }
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log('ICE state:', pc.iceConnectionState);
            };

            return pc;
        }

        // ----- offer / answer logic (simplified: offer from caller) -----
        async function startCall() {
            if (isCallActive) {
                alert('Call already active');
                return;
            }
            if (!localStream) {
                const started = await startLocalStream();
                if (!started) return;
            }
            // ensure video/audio tracks exist in localStream
            try {
                peerConnection = await createPeerConnection(localStream);
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                // in a real app you would send this offer to remote via signaling.
                // For demo, we simulate answer by creating an answer locally (echo mode)
                // But we want a 2-way call, so we create a fake remote answer.
                // Since this is a single-page demo, we simulate both sides.
                // For a true p2p, you would exchange via signaling server.
                // Here we create a second peer connection as "remote" to simulate.
                // This is a hack for demo: we establish a loopback call.
                simulateRemoteAnswer(peerConnection);
                isCallActive = true;
                setButtons(true);
                updateStatus('Calling...');
                updateConnectionInfo('⏳ Connecting...');
            } catch (err) {
                console.error('Offer error:', err);
                alert('Could not start call: ' + err.message);
                hangUp();
            }
        }

        // ----- simulate remote answer (for demo) -----
        async function simulateRemoteAnswer(offerPC) {
            try {
                const offerDesc = offerPC.localDescription;
                // Create a "remote" peer connection
                const remotePC = new RTCPeerConnection(rtcConfig);
                // When remotePC receives tracks, we add to remoteVideo
                remotePC.ontrack = (event) => {
                    if (!remoteStream) {
                        remoteStream = new MediaStream();
                        remoteVideo.srcObject = remoteStream;
                    }
                    remoteStream.addTrack(event.track);
                    remotePlaceholder.style.display = 'none';
                };
                // Also add local tracks to remotePC (to simulate both directions)
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        remotePC.addTrack(track, localStream);
                    });
                }
                // Set remote description
                await remotePC.setRemoteDescription(offerDesc);
                const answer = await remotePC.createAnswer();
                await remotePC.setLocalDescription(answer);
                // set remote description on offerPC
                await offerPC.setRemoteDescription(answer);
                // store remotePC to close later
                window.__remotePC = remotePC;
                updateStatus('Connected (loopback)');
                updateConnectionInfo('🔁 Loopback call (demo)');
                // we have both streams
            } catch (e) {
                console.error('Simulate answer error:', e);
                alert('Loopback error: ' + e.message);
                hangUp();
            }
        }

        // ----- hang up -----
        function hangUp() {
            if (window.__remotePC) {
                window.__remotePC.close();
                window.__remotePC = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (remoteStream) {
                remoteStream.getTracks().forEach(t => t.stop());
                remoteStream = null;
                remoteVideo.srcObject = null;
                remotePlaceholder.style.display = 'flex';
                remotePlaceholder.innerHTML = '<i class="fas fa-video-slash"></i>';
            }
            if (localStream) {
                // keep local stream for reuse
                localVideo.srcObject = localStream;
            }
            isCallActive = false;
            setButtons(false);
            updateStatus('Ready');
            updateConnectionInfo('WebRTC · idle');
        }

        // ----- toggle video -----
        function toggleVideo() {
            if (!localStream) {
                alert('Start local stream first');
                return;
            }
            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length === 0) {
                // try to add video
                alert('No video track, restart with video');
                return;
            }
            isVideoEnabled = !isVideoEnabled;
            videoTracks.forEach(track => track.enabled = isVideoEnabled);
            toggleVideoBtn.innerHTML = isVideoEnabled ? '<i class="fas fa-video"></i> Video' : '<i class="fas fa-video-slash"></i> Video';
            localPlaceholder.style.display = isVideoEnabled ? 'none' : 'flex';
            if (!isVideoEnabled) {
                localPlaceholder.innerHTML = '<i class="fas fa-camera"></i>';
            } else {
                localPlaceholder.style.display = 'none';
            }
        }

        // ----- toggle audio -----
        function toggleAudio() {
            if (!localStream) {
                alert('Start local stream first');
                return;
            }
            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length === 0) return;
            isAudioEnabled = !isAudioEnabled;
            audioTracks.forEach(track => track.enabled = isAudioEnabled);
            toggleAudioBtn.innerHTML = isAudioEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        }

        // ----- reset everything -----
        function resetAll() {
            hangUp();
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            localPlaceholder.style.display = 'flex';
            localPlaceholder.innerHTML = '<i class="fas fa-camera"></i>';
            remotePlaceholder.style.display = 'flex';
            remotePlaceholder.innerHTML = '<i class="fas fa-video-slash"></i>';
            isVideoEnabled = true;
            isAudioEnabled = true;
            toggleVideoBtn.innerHTML = '<i class="fas fa-video"></i> Video';
            toggleAudioBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            updateStatus('Ready');
            updateConnectionInfo('WebRTC · idle');
            setButtons(false);
        }

        // ----- event bindings -----
        callBtn.addEventListener('click', startCall);
        hangupBtn.addEventListener('click', hangUp);
        toggleVideoBtn.addEventListener('click', toggleVideo);
        toggleAudioBtn.addEventListener('click', toggleAudio);

        startLocalBtn.addEventListener('click', async () => {
            await startLocalStream();
        });

        resetIcon.addEventListener('click', resetAll);

        // auto-start local stream on page load for better UX
        window.addEventListener('load', () => {
            setTimeout(async () => {
                await startLocalStream();
                updateStatus('Ready');
            }, 300);
        });

        // handle visibility change to avoid issues
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && localStream) {
                // optional: mute or pause
            }
        });

        // expose for debugging
        window.__reset = resetAll;
        window.__hangup = hangUp;
    })();
</script>
</body>
</html>
