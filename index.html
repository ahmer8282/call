<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>📡 WalkieTalk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0e111b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            touch-action: manipulation;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #1a1e2c;
            border-radius: 44px;
            padding: 22px 18px 26px;
            border: 1px solid #31384d;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #c8d0e6;
            padding-bottom: 12px;
            border-bottom: 1px solid #2f3649;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 i { color: #f5b042; }
        .status-badge {
            background: #2e354a;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #aab3d0;
            border: 1px solid #3d455e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge i { color: #4caf84; font-size: 0.55rem; }
        .status-badge.off i { color: #e74c5e; }
        .status-badge.error i { color: #e74c5e; }

        .peer-row {
            background: #11141f;
            border-radius: 60px;
            padding: 8px 14px;
            margin: 12px 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 1px solid #2d3447;
            flex-wrap: wrap;
        }
        .peer-row .my-id {
            color: #bcc8f0;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: monospace;
            word-break: break-all;
            flex: 1;
            min-width: 80px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .peer-row .my-id:hover {
            background: #2a3045;
        }
        .peer-row .btn-sm {
            background: #3f4b6b;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            color: white;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid #5b6890;
            box-shadow: 0 3px 0 #1f263a;
            transition: 0.06s linear;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .peer-row .btn-sm:active { transform: translateY(3px); box-shadow: 0 0px 0 #1f263a; }
        .peer-row .btn-sm:disabled { opacity: 0.4; transform: translateY(2px); box-shadow: 0 1px 0 #1f263a; pointer-events: none; }

        .mode-toggle {
            display: flex;
            background: #11141f;
            border-radius: 60px;
            padding: 4px;
            margin: 6px 0 14px;
            border: 1px solid #2a3045;
        }
        .mode-toggle .mode-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: #8a94b5;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mode-toggle .mode-btn.active {
            background: #2f3a57;
            color: #e8edff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .mode-toggle .mode-btn:active { transform: scale(0.96); }

        .remote-input-area {
            display: none;
            background: #11141f;
            border-radius: 60px;
            padding: 6px 6px 6px 16px;
            margin: 0 0 14px;
            border: 1px solid #2d3447;
            align-items: center;
            gap: 8px;
        }
        .remote-input-area.show { display: flex; }
        .remote-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 4px;
            color: #d0d8f0;
            font-size: 0.85rem;
            outline: none;
            min-width: 80px;
        }
        .remote-input-area input::placeholder { color: #5c6583; }
        .remote-input-area .btn-call {
            background: #2d7a5a;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #3fa07a;
            box-shadow: 0 3px 0 #154d37;
            transition: 0.06s linear;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .remote-input-area .btn-call:active { transform: translateY(3px); box-shadow: 0 0px 0 #154d37; }
        .remote-input-area .btn-call:disabled { opacity: 0.4; transform: translateY(2px); box-shadow: 0 1px 0 #154d37; pointer-events: none; }

        .video-grid {
            margin: 10px 0 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .video-box {
            background: #0b0d16;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            border: 2px solid #2a3045;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #080a12;
            display: block;
        }
        .video-box .label {
            position: absolute;
            bottom: 8px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 500;
            color: #d0d8f0;
            border: 1px solid #4b536e;
            pointer-events: none;
        }
        .video-box .label.right { left: auto; right: 10px; }
        .video-box .placeholder {
            color: #3d455e;
            font-size: 2.6rem;
            opacity: 0.5;
            position: absolute;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 6px 0 10px;
        }
        .btn {
            background: #2f3649;
            border: none;
            border-radius: 60px;
            padding: 9px 14px;
            color: #d3daf5;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid #414a63;
            box-shadow: 0 4px 0 #141824;
            transition: 0.06s linear;
            touch-action: manipulation;
            flex: 1 1 auto;
            min-width: 60px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #141824; }
        .btn:disabled { opacity: 0.35; transform: translateY(3px); box-shadow: 0 1px 0 #141824; pointer-events: none; }
        .btn-danger { background: #9e3d4a; border-color: #c95666; color: white; box-shadow: 0 4px 0 #632b33; }
        .btn-warning { background: #b8863a; border-color: #dfa84a; color: #1a1e2c; box-shadow: 0 4px 0 #7a5a24; }
        .btn-icon {
            background: transparent;
            border: 1px solid #3f4865;
            border-radius: 60px;
            padding: 8px 12px;
            color: #bcc4e0;
            font-size: 0.9rem;
            box-shadow: none;
            min-width: 44px;
            flex: 0 1 auto;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
        }
        .btn-icon:active { transform: scale(0.94); }
        .btn-icon.active {
            background: #2f3a57;
            color: #4caf84;
            border-color: #4caf84;
        }

        .info-line {
            margin-top: 10px;
            padding: 8px 14px;
            background: #11141f;
            border-radius: 40px;
            color: #8a94b5;
            font-size: 0.65rem;
            text-align: center;
            border: 1px solid #252b3e;
        }
        .info-line i { color: #f0b34b; margin-right: 4px; }
        .info-line.error { color: #e74c5e; border-color: #e74c5e; }
        .info-line.success { color: #4caf84; border-color: #4caf84; }

        .footer {
            margin-top: 10px;
            color: #4a5370;
            font-size: 0.55rem;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .waiting-pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-bolt"></i> WalkieTalk</h1>
        <div class="status-badge" id="statusBadge"><i class="fas fa-circle"></i> <span id="statusText">Offline</span></div>
    </div>

    <div class="peer-row">
        <span class="my-id" id="myIdDisplay">⚡ click to set ID</span>
        <button class="btn-sm" id="connectBtn"><i class="fas fa-plug"></i> Go online</button>
        <button class="btn-sm" id="copyBtn"><i class="far fa-copy"></i></button>
    </div>

    <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="caller"><i class="fas fa-phone-alt"></i> Caller</button>
        <button class="mode-btn" data-mode="receiver"><i class="fas fa-headset"></i> Receiver</button>
    </div>

    <div class="remote-input-area show" id="remoteInputArea">
        <input type="text" id="remoteIdInput" placeholder="Enter remote Peer ID to call..." />
        <button class="btn-call" id="callBtn"><i class="fas fa-phone-alt"></i> Call</button>
    </div>

    <div class="video-grid">
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <span class="label right"><i class="fas fa-user"></i> Remote</span>
            <div class="placeholder" id="remotePlaceholder"><i class="fas fa-video-slash"></i></div>
        </div>
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="label"><i class="fas fa-user"></i> You</span>
            <div class="placeholder" id="localPlaceholder"><i class="fas fa-camera"></i></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-danger" id="hangupBtn" disabled><i class="fas fa-phone-slash"></i> Hangup</button>
        <button class="btn btn-warning" id="toggleVideoBtn"><i class="fas fa-video"></i> Video</button>
        <button class="btn-icon" id="cameraSwitchBtn" title="Switch Camera"><i class="fas fa-sync-alt"></i></button>
        <button class="btn btn-icon" id="toggleAudioBtn"><i class="fas fa-microphone"></i></button>
    </div>

    <div class="info-line" id="infoLine"><i class="fas fa-info-circle"></i> Click "Go online" to connect</div>
    <div class="footer">PeerJS · share your ID so others can call you</div>
</div>

<script>
    (function() {
        "use strict";

        // DOM
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const localPlaceholder = document.getElementById('localPlaceholder');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');
        const infoLine = document.getElementById('infoLine');
        const myIdDisplay = document.getElementById('myIdDisplay');

        const connectBtn = document.getElementById('connectBtn');
        const copyBtn = document.getElementById('copyBtn');
        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const cameraSwitchBtn = document.getElementById('cameraSwitchBtn');
        const remoteIdInput = document.getElementById('remoteIdInput');
        const remoteInputArea = document.getElementById('remoteInputArea');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // State
        let localStream = null;
        let remoteStream = null;
        let peer = null;
        let call = null;
        let isCallActive = false;
        let isVideoEnabled = true;
        let isAudioEnabled = true;
        let isFrontCamera = true;
        let myPeerId = '';
        let remotePeerId = '';
        let isOnline = false;
        let currentMode = 'caller';

        // ----- Persistent ID -----
        const STORAGE_KEY = 'walkietalk_peer_id';
        
        function getStoredId() {
            try {
                return localStorage.getItem(STORAGE_KEY) || null;
            } catch(e) {
                return null;
            }
        }

        function storeId(id) {
            try {
                localStorage.setItem(STORAGE_KEY, id);
            } catch(e) {}
        }

        function generateId() {
            return 'wt-' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        }

        // ----- Camera switch -----
        async function switchCamera() {
            if (!localStream) {
                updateInfo('Start local stream first');
                return;
            }

            isFrontCamera = !isFrontCamera;
            cameraSwitchBtn.classList.toggle('active', !isFrontCamera);
            
            try {
                const videoTrack = localStream.getVideoTracks()[0];
                if (!videoTrack) {
                    updateInfo('No video track to switch');
                    return;
                }

                videoTrack.stop();
                localStream.removeTrack(videoTrack);

                const constraints = {
                    audio: false,
                    video: {
                        facingMode: isFrontCamera ? 'user' : 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };

                const newStream = await navigator.mediaDevices.getUserMedia(constraints);
                const newVideoTrack = newStream.getVideoTracks()[0];
                
                if (newVideoTrack) {
                    localStream.addTrack(newVideoTrack);
                    localVideo.srcObject = localStream;
                    
                    if (call && isCallActive) {
                        const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) {
                            await sender.replaceTrack(newVideoTrack);
                        }
                    }
                    
                    updateInfo(isFrontCamera ? '📷 Front camera' : '📷 Back camera');
                }
                
                newStream.getTracks().forEach(t => {
                    if (t.kind !== 'video') t.stop();
                });
                
            } catch (err) {
                console.error('Camera switch error:', err);
                isFrontCamera = !isFrontCamera;
                cameraSwitchBtn.classList.toggle('active', !isFrontCamera);
                updateInfo('Camera switch failed: ' + err.message);
            }
        }

        // ----- Helpers -----
        function updateStatus(text, online = true, isError = false) {
            statusText.innerText = text;
            statusBadge.className = 'status-badge' + (online ? '' : ' off') + (isError ? ' error' : '');
        }

        function updateInfo(text, type = '') {
            infoLine.className = 'info-line ' + type;
            infoLine.innerHTML = '<i class="fas fa-info-circle"></i> ' + text;
        }

        function setButtons(callActive) {
            hangupBtn.disabled = !callActive;
            cameraSwitchBtn.disabled = !isOnline;
            if (callActive) {
                callBtn.disabled = true;
                callBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Calling...';
            } else {
                callBtn.disabled = !isOnline || currentMode === 'receiver';
                callBtn.innerHTML = '<i class="fas fa-phone-alt"></i> Call';
            }
        }

        function resetCallUI() {
            if (call) { call.close(); call = null; }
            if (remoteStream) {
                remoteStream.getTracks().forEach(t => t.stop());
                remoteStream = null;
                remoteVideo.srcObject = null;
            }
            remotePlaceholder.style.display = 'flex';
            remotePlaceholder.innerHTML = '<i class="fas fa-video-slash"></i>';
            isCallActive = false;
            setButtons(false);
            updateStatus(isOnline ? 'Ready' : 'Offline', isOnline);
            updateInfo(isOnline ? (currentMode === 'caller' ? 'Enter ID and call' : 'Waiting for incoming call...') : 'Not connected');
            remotePeerId = '';
            if (currentMode === 'receiver') {
                remotePlaceholder.innerHTML = '<i class="fas fa-headset waiting-pulse"></i>';
                remotePlaceholder.style.fontSize = '3rem';
            }
        }

        function fullReset() {
            if (call) { call.close(); call = null; }
            if (peer) { peer.destroy(); peer = null; }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                localVideo.srcObject = null;
            }
            if (remoteStream) {
                remoteStream.getTracks().forEach(t => t.stop());
                remoteStream = null;
                remoteVideo.srcObject = null;
            }
            localPlaceholder.style.display = 'flex';
            localPlaceholder.innerHTML = '<i class="fas fa-camera"></i>';
            remotePlaceholder.style.display = 'flex';
            remotePlaceholder.innerHTML = '<i class="fas fa-video-slash"></i>';
            isCallActive = false;
            isVideoEnabled = true;
            isAudioEnabled = true;
            isFrontCamera = true;
            cameraSwitchBtn.classList.remove('active');
            toggleVideoBtn.innerHTML = '<i class="fas fa-video"></i> Video';
            toggleAudioBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            remotePeerId = '';
            isOnline = false;
            updateStatus('Offline', false);
            updateInfo('Click "Go online"');
            setButtons(false);
            connectBtn.innerHTML = '<i class="fas fa-plug"></i> Go online';
            myIdDisplay.innerText = '⚡ click to set ID';
            callBtn.innerHTML = '<i class="fas fa-phone-alt"></i> Call';
            callBtn.disabled = true;
        }

        // ----- Get local stream with better error handling -----
        async function getLocalStream(videoOn = true, audioOn = true) {
            try {
                const constraints = {
                    audio: audioOn,
                    video: videoOn ? { 
                        facingMode: isFrontCamera ? 'user' : 'environment',
                        width: { ideal: 640 }, 
                        height: { ideal: 480 } 
                    } : false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                // Verify stream has tracks
                if (stream.getTracks().length === 0) {
                    throw new Error('No media tracks available');
                }
                return stream;
            } catch (err) {
                console.error('getUserMedia error:', err);
                if (videoOn) {
                    try {
                        const audioOnly = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                        if (audioOnly.getTracks().length > 0) {
                            updateInfo('Audio only (no camera)', 'error');
                            return audioOnly;
                        }
                    } catch (e2) {
                        throw new Error('No audio or video: ' + e2.message);
                    }
                }
                throw err;
            }
        }

        async function startLocalStream() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                localStream = await getLocalStream(isVideoEnabled, isAudioEnabled);
                localVideo.srcObject = localStream;
                localPlaceholder.style.display = 'none';
                
                const hasVideo = localStream.getVideoTracks().length > 0;
                const hasAudio = localStream.getAudioTracks().length > 0;
                
                if (!hasVideo) {
                    localPlaceholder.style.display = 'flex';
                    localPlaceholder.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                    updateInfo('Audio only - no camera access', 'error');
                } else if (!hasAudio) {
                    updateInfo('Video only - no microphone', 'error');
                } else {
                    updateInfo(isOnline ? 'Ready' : 'Local ready', 'success');
                }
                
                updateStatus(isOnline ? 'Ready' : 'Local ready', isOnline);
                return localStream;
            } catch (err) {
                console.error('Start stream error:', err);
                updateInfo('❌ Camera/mic error: ' + err.message, 'error');
                alert('Camera/mic error: ' + err.message + '\n\nPlease allow camera and microphone permissions in your browser settings.');
                return null;
            }
        }

        // ----- Connect Peer -----
        function connectPeer() {
            if (peer) {
                peer.destroy();
                peer = null;
            }

            let id = getStoredId();
            if (!id) {
                id = generateId();
                storeId(id);
            }
            myPeerId = id;
            myIdDisplay.innerText = id;

            updateStatus('Connecting...', true);
            updateInfo('Connecting to PeerJS...');

            peer = new Peer(id, {
                debug: 2
            });

            peer.on('open', (id) => {
                myPeerId = id;
                myIdDisplay.innerText = id;
                storeId(id);
                isOnline = true;
                updateStatus('✅ Ready', true);
                updateInfo(currentMode === 'caller' ? 'Enter ID and call' : 'Waiting for incoming call...', 'success');
                connectBtn.innerHTML = '<i class="fas fa-check"></i> Online';
                
                // Auto-start local stream
                startLocalStream();
                
                callBtn.disabled = (currentMode === 'receiver');
                cameraSwitchBtn.disabled = false;
                
                if (currentMode === 'receiver') {
                    remotePlaceholder.innerHTML = '<i class="fas fa-headset waiting-pulse"></i>';
                    remotePlaceholder.style.fontSize = '3rem';
                    remotePlaceholder.style.display = 'flex';
                }
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'unavailable-id') {
                    const newId = generateId();
                    storeId(newId);
                    myIdDisplay.innerText = newId;
                    updateInfo('ID taken, using: ' + newId, 'error');
                    if (peer) {
                        peer.destroy();
                        peer = null;
                    }
                    setTimeout(() => {
                        connectPeer();
                    }, 500);
                } else if (err.type === 'network') {
                    updateStatus('Network error', false, true);
                    updateInfo('❌ Check internet connection', 'error');
                    connectBtn.innerHTML = '<i class="fas fa-plug"></i> Retry';
                } else {
                    updateStatus('Error', false, true);
                    updateInfo('❌ Error: ' + err.type, 'error');
                    connectBtn.innerHTML = '<i class="fas fa-plug"></i> Retry';
                }
            });

            peer.on('disconnected', () => {
                updateStatus('Disconnected', false, true);
                updateInfo('Reconnecting...', 'error');
                connectBtn.innerHTML = '<i class="fas fa-plug"></i> Reconnect';
                setTimeout(() => {
                    if (peer && !peer.open) {
                        peer.reconnect();
                    }
                }, 2000);
            });

            peer.on('close', () => {
                updateStatus('Closed', false);
                updateInfo('Connection closed');
                connectBtn.innerHTML = '<i class="fas fa-plug"></i> Go online';
                fullReset();
            });

            // ----- Auto-answer incoming calls -----
            peer.on('call', (incomingCall) => {
                if (isCallActive) { 
                    incomingCall.answer(); 
                    return; 
                }
                
                const answerCall = () => {
                    if (!localStream) {
                        startLocalStream().then(() => {
                            if (localStream) {
                                call = incomingCall;
                                call.answer(localStream);
                                setupCallListeners(call);
                                remotePeerId = incomingCall.peer;
                                isCallActive = true;
                                setButtons(true);
                                updateStatus('Connected', true);
                                updateInfo('📞 Call from ' + remotePeerId, 'success');
                                remotePlaceholder.style.display = 'flex';
                                remotePlaceholder.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
                                remotePlaceholder.style.fontSize = '2.6rem';
                            }
                        });
                        return;
                    }
                    call = incomingCall;
                    call.answer(localStream);
                    setupCallListeners(call);
                    remotePeerId = incomingCall.peer;
                    isCallActive = true;
                    setButtons(true);
                    updateStatus('Connected', true);
                    updateInfo('📞 Call from ' + remotePeerId, 'success');
                    remotePlaceholder.style.display = 'flex';
                    remotePlaceholder.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
                    remotePlaceholder.style.fontSize = '2.6rem';
                };
                answerCall();
            });
        }

        // ----- Setup call listeners -----
        function setupCallListeners(mediaCall) {
            mediaCall.on('stream', (remoteStreamObj) => {
                console.log('✅ Remote stream received:', remoteStreamObj);
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    remoteVideo.srcObject = remoteStream;
                }
                remoteStreamObj.getTracks().forEach(t => {
                    if (!remoteStream.getTracks().find(rt => rt.id === t.id)) {
                        remoteStream.addTrack(t);
                        console.log('✅ Added track:', t.kind);
                    }
                });
                remotePlaceholder.style.display = 'none';
                updateStatus('Connected', true);
                updateInfo('🔗 Active with ' + remotePeerId, 'success');
            });
            
            mediaCall.on('close', () => { 
                console.log('Call closed');
                hangUp(); 
            });
            
            mediaCall.on('error', (err) => {
                console.error('Call error:', err);
                updateInfo('❌ Call error: ' + err.message, 'error');
                hangUp();
            });
        }

        // ----- Make outgoing call -----
        async function makeCall() {
            if (!peer) { 
                alert('Connect first - click "Go online"'); 
                return; 
            }
            if (!isOnline) { 
                alert('Not connected to PeerJS'); 
                return; 
            }
            if (!localStream) {
                await startLocalStream();
                if (!localStream) {
                    alert('No local stream available. Please allow camera/mic permissions.');
                    return;
                }
            }
            const target = remoteIdInput.value.trim();
            if (!target) { 
                alert('Enter remote Peer ID'); 
                return; 
            }
            remotePeerId = target;
            
            console.log('📞 Calling:', remotePeerId);
            console.log('Local stream tracks:', localStream.getTracks().map(t => t.kind));
            
            const mediaCall = peer.call(remotePeerId, localStream);
            call = mediaCall;
            setupCallListeners(mediaCall);
            isCallActive = true;
            setButtons(true);
            updateStatus('Calling...', true);
            updateInfo('⏳ Calling ' + remotePeerId);
            remotePlaceholder.style.display = 'flex';
            remotePlaceholder.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
            remotePlaceholder.style.fontSize = '2.6rem';
        }

        // ----- Hang up -----
        function hangUp() {
            if (call) { call.close(); call = null; }
            if (remoteStream) {
                remoteStream.getTracks().forEach(t => t.stop());
                remoteStream = null;
                remoteVideo.srcObject = null;
            }
            remotePlaceholder.style.display = 'flex';
            remotePlaceholder.innerHTML = '<i class="fas fa-video-slash"></i>';
            remotePlaceholder.style.fontSize = '2.6rem';
            isCallActive = false;
            setButtons(false);
            updateStatus(isOnline ? 'Ready' : 'Offline', isOnline);
            updateInfo(isOnline ? (currentMode === 'caller' ? 'Enter ID and call' : 'Waiting for incoming call...') : 'Not connected');
            remotePeerId = '';
            if (currentMode === 'receiver' && isOnline) {
                remotePlaceholder.innerHTML = '<i class="fas fa-headset waiting-pulse"></i>';
                remotePlaceholder.style.fontSize = '3rem';
                remotePlaceholder.style.display = 'flex';
            }
        }

        // ----- Toggle video / audio -----
        function toggleVideo() {
            if (!localStream) { 
                updateInfo('Start local stream first', 'error');
                return; 
            }
            const vt = localStream.getVideoTracks();
            if (vt.length === 0) { 
                updateInfo('No video track', 'error');
                return; 
            }
            isVideoEnabled = !isVideoEnabled;
            vt.forEach(t => t.enabled = isVideoEnabled);
            toggleVideoBtn.innerHTML = isVideoEnabled ? '<i class="fas fa-video"></i> Video' : '<i class="fas fa-video-slash"></i> Video';
            localPlaceholder.style.display = isVideoEnabled ? 'none' : 'flex';
            if (!isVideoEnabled) localPlaceholder.innerHTML = '<i class="fas fa-camera"></i>';
            else localPlaceholder.style.display = 'none';
            updateInfo(isVideoEnabled ? '📷 Video on' : '📷 Video off');
        }

        function toggleAudio() {
            if (!localStream) { 
                updateInfo('Start local stream first', 'error');
                return; 
            }
            const at = localStream.getAudioTracks();
            if (at.length === 0) {
                updateInfo('No audio track', 'error');
                return;
            }
            isAudioEnabled = !isAudioEnabled;
            at.forEach(t => t.enabled = isAudioEnabled);
            toggleAudioBtn.innerHTML = isAudioEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
            updateInfo(isAudioEnabled ? '🎤 Mic on' : '🎤 Mic off');
        }

        // ----- Copy ID -----
        function copyId() {
            const id = myIdDisplay.innerText;
            if (!id || id.includes('⚡')) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(id).then(() => alert('Copied: ' + id)).catch(() => fallbackCopy(id));
            } else { fallbackCopy(id); }
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('Copied: ' + text);
        }

        // ----- Edit ID -----
        function editId() {
            const currentId = myIdDisplay.innerText;
            if (currentId.includes('⚡')) {
                const suggested = generateId();
                const newId = prompt('Enter your Peer ID (must be unique):', suggested);
                if (newId && newId.trim() !== '') {
                    storeId(newId.trim());
                    myIdDisplay.innerText = newId.trim();
                    updateInfo('ID set. Click "Go online" to connect');
                }
                return;
            }
            const newId = prompt('Enter your Peer ID (must be unique):', currentId);
            if (newId && newId.trim() !== '' && newId !== currentId) {
                const trimmed = newId.trim();
                storeId(trimmed);
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
                isOnline = false;
                connectBtn.innerHTML = '<i class="fas fa-plug"></i> Go online';
                myIdDisplay.innerText = trimmed;
                updateStatus('Offline', false);
                updateInfo('Reconnecting with new ID...');
                setTimeout(() => {
                    connectPeer();
                }, 300);
            }
        }

        // ----- Mode switching -----
        function setMode(mode) {
            currentMode = mode;
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (mode === 'caller') {
                remoteInputArea.classList.add('show');
                remoteInputArea.style.display = 'flex';
                callBtn.style.display = 'inline-flex';
                updateInfo(isOnline ? 'Enter remote ID and press Call' : 'Go online first');
                if (isOnline) callBtn.disabled = false;
                else callBtn.disabled = true;
                if (!isCallActive && isOnline) {
                    remotePlaceholder.innerHTML = '<i class="fas fa-video-slash"></i>';
                    remotePlaceholder.style.fontSize = '2.6rem';
                }
            } else {
                remoteInputArea.classList.remove('show');
                remoteInputArea.style.display = 'none';
                updateInfo(isOnline ? 'Waiting for incoming call...' : 'Go online first');
                callBtn.disabled = true;
                if (!isCallActive && isOnline) {
                    remotePlaceholder.innerHTML = '<i class="fas fa-headset waiting-pulse"></i>';
                    remotePlaceholder.style.fontSize = '3rem';
                    remotePlaceholder.style.display = 'flex';
                }
            }
            setButtons(isCallActive);
        }

        // ----- Event bindings -----
        connectBtn.addEventListener('click', connectPeer);
        copyBtn.addEventListener('click', copyId);
        callBtn.addEventListener('click', makeCall);
        hangupBtn.addEventListener('click', hangUp);
        toggleVideoBtn.addEventListener('click', toggleVideo);
        toggleAudioBtn.addEventListener('click', toggleAudio);
        cameraSwitchBtn.addEventListener('click', switchCamera);
        myIdDisplay.addEventListener('click', editId);

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setMode(btn.dataset.mode);
            });
        });

        remoteIdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') makeCall();
        });

        // Auto-connect on load
        window.addEventListener('load', () => {
            const storedId = getStoredId();
            if (storedId) {
                myIdDisplay.innerText = storedId;
                setTimeout(connectPeer, 1000);
            } else {
                myIdDisplay.innerText = '⚡ click to set ID';
                updateInfo('Click your ID to set a Peer ID, then click "Go online"');
            }
        });

        // expose
        window.__reset = fullReset;
        window.__hangup = hangUp;
        window.__reconnect = connectPeer;
    })();
</script>
</body>
</html>
